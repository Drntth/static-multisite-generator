[project]
name = "static-multisite-generator"
version = "1.0.0"
description = "Python and Jinja2 generator for several static websites from one source"
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
